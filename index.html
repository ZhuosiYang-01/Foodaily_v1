    <script>
      // iOS 兼容性补丁：动态将 SVG 转换为 PNG 以确保“添加到主屏幕”图标正常显示
      (function() {
        const svg = `<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="512" height="512" rx="128" fill="#FDFCFB"/><circle cx="256" cy="256" r="180" stroke="#846341" stroke-width="12" stroke-dasharray="20 15" opacity="0.3"/><path d="M210 160V352M210 160H310M210 256H285" stroke="#846341" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/><circle cx="310" cy="160" r="16" fill="#846341"/></svg>`;
        const blob = new Blob([svg], {type: 'image/svg+xml'});
        const url = URL.createObjectURL(blob);
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          canvas.width = 512;
          canvas.height = 512;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0);
          try {
            const pngUrl = canvas.toDataURL('image/png');
            const appleIcon = document.querySelector('link[rel="apple-touch-icon"]');
            if (appleIcon) appleIcon.href = pngUrl;
          } catch (e) {}
          URL.revokeObjectURL(url);
        };
        img.src = url;
      })();
    </script>
